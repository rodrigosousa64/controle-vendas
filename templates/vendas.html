<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ee663e" />
    <title>Vendas — Venda.</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Ir para o conteúdo</a>

    <aside class="sidebar">
      <a class="brand" href="/dashboard" aria-label="Venda, início">
        <span class="brand-icon" aria-hidden="true">v<span>•</span></span>
        venda<span class="brand-dot">.</span>
      </a>
      <div class="store-name">Minha Loja</div>
      <nav aria-label="Menu principal">
        <a href="/dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Visão geral
        </a>
        <a href="/produtos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></svg>
          Produtos
        </a>
        <a href="/vendas" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
          Vendas
        </a>
        <a href="/relatorios">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M4 3v17h17M8 15v-4M13 15V7M18 15V4"/></svg>
          Relatórios
        </a>
      </nav>
      <div style="margin-top:auto;padding-top:16px;border-top:1px solid #f2f4f7;">
        <button type="button" class="button secondary full" data-action="shutdown" style="justify-content:flex-start;font-size:13px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/></svg>
          Encerrar sistema
        </button>
      </div>
    </aside>

    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">Minha Loja <span>/</span> <strong>Vendas</strong></div>
        <div class="topbar-right"><time id="current-date"></time></div>
      </header>

      <main id="main-content" tabindex="-1">
        <div class="page-heading">
          <div>
            <h1>Histórico de Vendas</h1>
            <p>Registro de vendas, emissão de comprovantes e cancelamento.</p>
          </div>
          <div class="actions">
            <button type="button" class="button primary" id="btn-nova-venda">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Nova venda
            </button>
          </div>
        </div>

        <!-- Filtro de vendas -->
        <div class="filter-bar" style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <input type="search" id="sales-search" placeholder="Pesquisar por cliente ou número da venda..." style="width:100%;padding:9px 12px;border:1px solid #d0d5dd;border-radius:8px;" />
          </div>
          <select id="sales-filter-status" style="padding:9px 12px;border:1px solid #d0d5dd;border-radius:8px;">
            <option value="all">Todas as situações</option>
            <option value="completed">Concluídas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>

        <section class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Venda</th>
                  <th>Data/Hora</th>
                  <th>Cliente</th>
                  <th>Pagamento</th>
                  <th class="right">Itens</th>
                  <th class="right">Total</th>
                  <th>Situação</th>
                  <th class="right">Ações</th>
                </tr>
              </thead>
              <tbody id="sales-tbody">
                <tr><td colspan="8" class="loading">Carregando histórico de vendas...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="modal"></dialog>
    <dialog id="confirm-modal" class="confirm-dialog"></dialog>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/vendas.js"></script>
  </body>
</html>
